<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ZZ Craft</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:Roboto,system-ui,sans-serif;background:#fff;color:#040404;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:fixed;inset:0;display:flex}
#stage{position:relative;flex:1;min-width:0;height:100%;overflow:hidden;
  background-color:#fff;
  background-image:radial-gradient(#e8e8e8 1px,transparent 1px);background-size:28px 28px}
#sidebar{width:320px;flex:none;height:100%;border-left:1px solid #c8c8c8;background:#fff;display:flex;flex-direction:column;position:relative;z-index:5}
#sidebar.drop{background:#fff3f3}
#list{flex:1;overflow-y:auto;padding:14px 12px 10px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;touch-action:pan-y}
#bar{border-top:1px solid #c8c8c8;padding:8px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#bar .tabs{display:flex;gap:4px;width:100%}
.tab{flex:1;border:1px solid #c8c8c8;background:#fff;border-radius:6px;padding:6px 4px;font:500 12px Roboto;cursor:pointer;color:#555}
.tab.on{background:#040404;color:#fff;border-color:#040404}
#search{width:100%;border:1px solid #c8c8c8;border-radius:6px;padding:9px 10px;font:400 14px Roboto;outline:none;user-select:text;-webkit-user-select:text}
#search:focus{border-color:#040404}
.item{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border:1px solid #c8c8c8;border-radius:8px;background:#fff;font-size:16px;line-height:1.15;cursor:grab;white-space:nowrap;position:relative;touch-action:none}
.item:hover{border-color:#6a6a6a;background:#fafafa}
.item .em{font-size:17px}
.item.new{background:#f2fbea;border-color:#5aa02c}
.item.new::after,.item.first::after{content:attr(data-badge);position:absolute;top:-9px;right:6px;background:#5aa02c;color:#fff;font:700 9px Roboto;padding:1px 5px;border-radius:8px;letter-spacing:.2px;pointer-events:none}
.item.first{background:#fff7e0;border-color:#e0a21d}
.item.first::after{background:#e0a21d}
#stage .item{position:absolute;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.08)}
#stage .item.drag{z-index:50;cursor:grabbing;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#stage .item.hot{border-color:#2f7bff;background:#eaf2ff}
#stage .item.pop{animation:pop .28s ease-out}
#stage .item.busy{opacity:.65}
@keyframes pop{0%{transform:scale(.6);opacity:.2}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.spin{width:14px;height:14px;border:2px solid #ccc;border-top-color:#333;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
#logo{position:absolute;left:18px;bottom:14px;font:700 26px Roboto;letter-spacing:-.5px;color:#040404;opacity:.9;pointer-events:none}
#logo small{display:block;font:400 11px Roboto;color:#888;letter-spacing:.3px;margin-top:-2px}
#tools{position:absolute;left:18px;top:14px;display:flex;gap:8px;z-index:6}
.btn{border:1px solid #c8c8c8;background:#fff;border-radius:8px;padding:7px 12px;font:500 13px Roboto;cursor:pointer;color:#333}
.btn:hover{background:#f4f4f4}
#count{position:absolute;right:16px;top:14px;font:500 13px Roboto;color:#777;z-index:6;background:#ffffffcc;padding:2px 6px;border-radius:6px}
#toast{position:absolute;left:50%;top:18px;transform:translateX(-50%) translateY(-20px);background:#040404;color:#fff;padding:9px 16px;border-radius:20px;font:500 14px Roboto;opacity:0;transition:.25s;pointer-events:none;z-index:99;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:100;touch-action:auto}
#modal.show{display:flex}
#modal .box{background:#fff;border-radius:12px;padding:20px;width:min(92vw,400px);box-shadow:0 10px 40px #0005;user-select:text;-webkit-user-select:text}
#modal h3{margin:0 0 8px;font:700 18px Roboto}
#modal p{margin:6px 0 12px;font-size:13px;color:#555;line-height:1.4}
#modal label{display:block;font:500 12px Roboto;margin:8px 0 3px}
#modal select,#modal input{width:100%;padding:8px;border:1px solid #c8c8c8;border-radius:6px;font:400 14px Roboto}
#modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.btn.pri{background:#040404;color:#fff;border-color:#040404}
.btn.red{background:#d33;color:#fff;border-color:#d33}
@media(max-width:700px){
  #app{flex-direction:column}
  #sidebar{width:100%;height:36%;border-left:0;border-top:1px solid #c8c8c8;order:2}

  #logo{font-size:20px}

/* ---------- build recipe + emoji tables ---------- */
const EMOJI={};      // lower name -> emoji
const NAME={};       // lower name -> display name
const RECIPES={};    // "a|b" sorted -> [name, emoji]
const keyOf=(a,b)=>{a=a.toLowerCase();b=b.toLowerCase();return a<b?a+"|"+b:b+"|"+a};
for(const [n,e] of BASE){EMOJI[n.toLowerCase()]=e;NAME[n.toLowerCase()]=n}
for(const line of RAW.split("\n")){
  const t=line.trim(); if(!t||!t.includes("=")) continue;
  const [lhs,rhs]=t.split("=");
  const [a,b]=lhs.split("+").map(s=>s.trim());
  const sp=rhs.trim().indexOf(" ");
  const em=rhs.trim().slice(0,sp), nm=rhs.trim().slice(sp+1).trim();
  RECIPES[keyOf(a,b)]=[nm,em];
  EMOJI[nm.toLowerCase()]=em; NAME[nm.toLowerCase()]=nm;
}

/* ---------- shared AI brain (results are saved for every player) ---------- */
// Same-origin on Netlify. If the page is hosted elsewhere, set this to your Netlify site URL.
const API_BASE="";
if(store.get("zz_v",0)<2){store.del("zz_cache");store.set("zz_v",2)}   // drop results from the old junk generator
const cache=store.get("zz_cache",{});
const inflight={};
// ~20,000 pre-made combos (made by Claude Haiku). Instant and free; anything not in here goes to the shared AI.
let BIG={};
const bigReady=fetch("recipes.json").then(r=>r.json()).then(j=>{BIG=j}).catch(()=>{});
async function fetchOnce(a,b){
  const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),9000);
  try{
    const r=await fetch(API_BASE+"/api/combine?a="+encodeURIComponent(a)+"&b="+encodeURIComponent(b),{signal:ctrl.signal});
    if(!r.ok) throw new Error("http "+r.status);
    const j=await r.json();
    if(!j||!j.name) throw new Error("bad");
    return {name:j.name,emoji:j.emoji||"❓",first:!!j.first};
  }finally{clearTimeout(t)}
}
async function combine(a,b){
  const k=keyOf(a,b);
  if(RECIPES[k]) return {name:RECIPES[k][0],emoji:RECIPES[k][1],first:false};
  await bigReady;
  if(BIG[k]) return {name:BIG[k][0],emoji:BIG[k][1],first:false};
  if(cache[k]) return {...cache[k],first:false};
  if(inflight[k]) return inflight[k];
  inflight[k]=(async()=>{
    let r;
    try{r=await fetchOnce(a,b)}catch(e){r=await fetchOnce(a,b)}   // one quick retry
    cache[k]={name:r.name,emoji:r.emoji};store.set("zz_cache",cache);
    return r;
  })();
  try{return await inflight[k]}finally{delete inflight[k]}
}

/* ---------- state ---------- */
const $=s=>document.querySelector(s);
const stage=$("#stage"),sidebar=$("#sidebar"),list=$("#list"),search=$("#search");
let discovered=store.get("zz_found",null)||BASE.map(([n,e],i)=>({name:n,emoji:e,t:i,first:false,isNew:false}));
let canvasItems=[];          // {id,name,emoji,x,y,el}
let sortMode="time", filter="";
let soundOn=store.get("zz_sound",true);
let nextId=1;

const saveFound=()=>store.set("zz_found",discovered);
const saveCanvas=()=>store.set("zz_canvas",canvasItems.map(c=>({name:c.name,emoji:c.emoji,x:c.x,y:c.y})));

/* ---------- audio ---------- */
let ac=null;
function blip(f1,f2,dur=.12){
  if(!soundOn) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type="sine";o.frequency.setValueAtTime(f1,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f2,ac.currentTime+dur);
    g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur+.05);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur+.06);
  }catch(e){}
}
const sndMerge=()=>blip(440,660);
const sndNew=()=>{blip(520,780,.12);setTimeout(()=>blip(780,1040,.18),110)};

/* ---------- toast ---------- */
let tt;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1800)}

/* ---------- sidebar rendering ---------- */
function mkItem(name,emoji){
  const d=document.createElement("div");d.className="item";
  d.innerHTML=`<span class="em"></span><span class="nm"></span>`;
  d.querySelector(".em").textContent=emoji;d.querySelector(".nm").textContent=name;
  d.dataset.name=name;d.dataset.emoji=emoji;
  return d;
}
function renderList(){
  let arr=discovered.slice();
  if(filter) arr=arr.filter(d=>d.name.toLowerCase().includes(filter));
  if(sortMode==="name") arr.sort((a,b)=>a.name.localeCompare(b.name));
  else if(sortMode==="disc") arr=arr.filter(d=>d.first).sort((a,b)=>b.t-a.t);
  else arr.sort((a,b)=>a.t-b.t);
  list.innerHTML="";
  for(const d of arr){
    const el=mkItem(d.name,d.emoji);
    if(d.first){el.classList.add("first");el.dataset.badge="First Discovery"}
    else if(d.isNew){el.classList.add("new");el.dataset.badge="New"}
    el.addEventListener("pointerdown",ev=>startFromSidebar(ev,d));
    list.appendChild(el);
  }
  $("#count").textContent=discovered.length+" items · "+discovered.filter(d=>d.first).length+" discoveries";
}

/* ---------- canvas items ---------- */
function addCanvasItem(name,emoji,x,y,opts={}){
  const el=mkItem(name,emoji);
  const c={id:nextId++,name,emoji,x,y,el};
  el.style.left=x+"px";el.style.top=y+"px";
  if(opts.pop) el.classList.add("pop");
  el.addEventListener("pointerdown",ev=>startDrag(ev,c));
  el.addEventListener("dblclick",()=>{const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();addCanvasItem(c.name,c.emoji,c.x+22,c.y+22,{pop:true});saveCanvas()});
  stage.appendChild(el);canvasItems.push(c);
  return c;
}
function removeCanvasItem(c){c.el.remove();canvasItems=canvasItems.filter(x=>x!==c)}
function clampPos(c){
  const w=c.el.offsetWidth,h=c.el.offsetHeight,sw=stage.clientWidth,sh=stage.clientHeight;
  c.x=Math.max(4,Math.min(sw-w-4,c.x));c.y=Math.max(4,Math.min(sh-h-4,c.y));
}

/* ---------- dragging ---------- */
let drag=null;
function startDrag(ev,c){
  if(ev.button!==undefined&&ev.button!==0) return;
  ev.preventDefault();
  const r=c.el.getBoundingClientRect();
  drag={c,ox:ev.clientX-r.left,oy:ev.clientY-r.top,pid:ev.pointerId,moved:false};
  c.el.classList.add("drag");
  c.el.parentNode.appendChild(c.el); // bring to front
  try{c.el.setPointerCapture(ev.pointerId)}catch(e){}
  blip(300,380,.05);
}
function startFromSidebar(ev,d){
  if(ev.button!==undefined&&ev.button!==0) return;
  ev.preventDefault();
  const s=stage.getBoundingClientRect();
  const c=addCanvasItem(d.name,d.emoji,ev.clientX-s.left-30,ev.clientY-s.top-18);
  c.el.style.visibility="hidden";
  requestAnimationFrame(()=>{c.el.style.visibility="";});
  const r=c.el.getBoundingClientRect();
  drag={c,ox:r.width/2,oy:r.height/2,pid:ev.pointerId,moved:true,fromSide:true};
  c.el.classList.add("drag");
  try{c.el.setPointerCapture(ev.pointerId)}catch(e){}
  // position under pointer
  c.x=ev.clientX-s.left-r.width/2;c.y=ev.clientY-s.top-r.height/2;
  c.el.style.left=c.x+"px";c.el.style.top=c.y+"px";
  // capture needs the element: re-route events via window
}
window.addEventListener("pointermove",ev=>{
  if(!drag) return;
  const s=stage.getBoundingClientRect(),c=drag.c;
  drag.moved=true;
  c.x=ev.clientX-s.left-drag.ox;c.y=ev.clientY-s.top-drag.oy;
  c.el.style.left=c.x+"px";c.el.style.top=c.y+"px";
  const overSide=pointInRect(ev.clientX,ev.clientY,sidebar.getBoundingClientRect());
  sidebar.classList.toggle("drop",overSide);
  // highlight hit target
  const hit=findHit(c);
  for(const o of canvasItems) o.el.classList.toggle("hot",o===hit);
});
window.addEventListener("pointerup",async ev=>{
  if(!drag) return;
  const {c}=drag;drag=null;
  c.el.classList.remove("drag");sidebar.classList.remove("drop");
  for(const o of canvasItems) o.el.classList.remove("hot");
  const overSide=pointInRect(ev.clientX,ev.clientY,sidebar.getBoundingClientRect());
  if(overSide){removeCanvasItem(c);saveCanvas();return}
  const hit=findHit(c);
  if(hit){await mergeItems(c,hit)}
  else{clampPos(c);c.el.style.left=c.x+"px";c.el.style.top=c.y+"px";saveCanvas()}
});
window.addEventListener("pointercancel",()=>{if(drag){drag.c.el.classList.remove("drag");drag=null}});
const pointInRect=(x,y,r)=>x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
function overlapArea(a,b){
  const x=Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left));
  const y=Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));
  return x*y;
}
function findHit(c){
  const ra=c.el.getBoundingClientRect();let best=null,bv=0;
  for(const o of canvasItems){
    if(o===c||o.busy) continue;
    const v=overlapArea(ra,o.el.getBoundingClientRect());
    const min=Math.min(ra.width*ra.height,o.el.offsetWidth*o.el.offsetHeight);
    if(v>min*.18&&v>bv){bv=v;best=o}
  }
  return best;
}

/* ---------- merge ---------- */
async function mergeItems(a,b){
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
  a.busy=b.busy=true;
  a.el.classList.add("busy");b.el.classList.add("busy");
  const an=a.name,bn=b.name;
  const spin=document.createElement("div");
  spin.className="item";spin.style.cssText=`position:absolute;left:${mx}px;top:${my}px;z-index:40`;
  spin.innerHTML=`<span class="spin"></span>`;stage.appendChild(spin);
  let res=null;
  try{res=await combine(an,bn)}catch(e){}
  spin.remove();
  if(!res){
    a.busy=b.busy=false;a.el.classList.remove("busy");b.el.classList.remove("busy");
    toast("Couldn't combine those, try again");return;
  }
  removeCanvasItem(a);removeCanvasItem(b);
  const {name,emoji,first}=res;
  const c=addCanvasItem(name,emoji,mx,my,{pop:true});
  requestAnimationFrame(()=>{clampPos(c);c.el.style.left=c.x+"px";c.el.style.top=c.y+"px";saveCanvas()});
  EMOJI[name.toLowerCase()]=emoji;
  const had=discovered.find(d=>d.name.toLowerCase()===name.toLowerCase());
  if(!had){
    discovered.push({name,emoji,t:nextT(),first,isNew:true});
    saveFound();renderList();
    if(first){toast("✨ First Discovery: "+emoji+" "+name);sndNew()}
    else{toast("New: "+emoji+" "+name);sndMerge()}
    if(sortMode==="time") list.scrollTop=list.scrollHeight;
  }else{sndMerge()}
}
let tCounter=Math.max(...discovered.map(d=>d.t),0);
function nextT(){return ++tCounter}
tCounter=Math.max(tCounter,discovered.length);

/* ---------- UI buttons ---------- */
function setSort(m){
  sortMode=m;
  for(const [id,mm] of [["#tTime","time"],["#tName","name"],["#tDisc","disc"]]) $(id).classList.toggle("on",mm===m);
  renderList();
}
$("#tTime").onclick=()=>setSort("time");
$("#tName").onclick=()=>setSort("name");
$("#tDisc").onclick=()=>setSort("disc");
search.addEventListener("input",()=>{filter=search.value.trim().toLowerCase();renderList()});
// clear "new" flags once viewed a while
list.addEventListener("pointerdown",()=>{});
setInterval(()=>{let ch=false;for(const d of discovered){if(d.isNew){d.isNew=false;ch=true}}if(ch&&!drag){saveFound()}},20000);

$("#bClear").onclick=()=>{for(const c of canvasItems.slice()) removeCanvasItem(c);saveCanvas();toast("Canvas cleared")};
$("#bSound").onclick=()=>{soundOn=!soundOn;store.set("zz_sound",soundOn);$("#bSound").textContent=soundOn?"🔊":"🔇"};
$("#bSound").textContent=soundOn?"🔊":"🔇";

const modal=$("#modal"),mbox=$("#mbox");
modal.addEventListener("pointerdown",e=>{if(e.target===modal) modal.classList.remove("show")});
$("#bReset").onclick=()=>{
  mbox.innerHTML=`<h3>Reset progress?</h3><p>This deletes every item you've discovered and clears the canvas. This can't be undone.</p><div class="row"><button class="btn" id="mNo">Cancel</button><button class="btn red" id="mYes">Reset</button></div>`;
  modal.classList.add("show");
  $("#mNo").onclick=()=>modal.classList.remove("show");
  $("#mYes").onclick=()=>{
    store.del("zz_found");store.del("zz_canvas");store.del("zz_cache");
    for(const c of canvasItems.slice()) removeCanvasItem(c);
    discovered=BASE.map(([n,e],i)=>({name:n,emoji:e,t:i,first:false,isNew:false}));
    for(const k in cache) delete cache[k];
    tCounter=discovered.length;renderList();modal.classList.remove("show");toast("Progress reset");
  };
};
/* ---------- init ---------- */
// restore canvas
const saved=store.get("zz_canvas",null);
if(saved&&saved.length){for(const s of saved) addCanvasItem(s.name,s.emoji,s.x,s.y)}
renderList();
// ensure all discovered items have emoji in lookup for generator
for(const d of discovered){EMOJI[d.name.toLowerCase()]=d.emoji;NAME[d.name.toLowerCase()]=d.name}
window.addEventListener("resize",()=>{for(const c of canvasItems){clampPos(c);c.el.style.left=c.x+"px";c.el.style.top=c.y+"px"}});
if(!saved||!saved.length){
  const w=stage.clientWidth,h=stage.clientHeight;
  // gentle hint
  toast("Drag items onto the canvas and combine them!");
}
window.__zz={combine,RECIPES,keyOf};
})();
</script>
